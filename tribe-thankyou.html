<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=768">
<title>Tribe Sauna + Ice — Enjoy Your Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --deep-teal: #325963;
    --sage-teal: #95C4BF;
    --soft-mint: #D9E9E1;
    --white: #ffffff;
    --off-white: #f7fbf9;

    /* Horizontal centre of the pulsing glow, measured from the LEFT edge
       of the 768px page. Sits directly above the KioskBuddy "Tap to Pay"
       button. Nudge this value left/right if the button moves. */
    --tap-x: 590px;

    /* Vertical sink of the glow below the page's bottom edge.
       More negative = glow sits lower / hugs the bar tighter.
       Back toward 0 = glow rises taller into the page. */
    --tap-y: -70px;
  }

  html, body {
    width: 768px;
    height: 1024px;
    overflow: hidden;
    font-family: 'DM Sans', sans-serif;
    background: var(--deep-teal);
  }

  .page {
    width: 768px;
    height: 1024px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* ── Decorative rings ── */
  .ring {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    border: 1px solid rgba(149,196,191,0.1);
  }
  .ring-1 { width: 500px; height: 500px; top: -180px; right: -160px; }
  .ring-2 { width: 340px; height: 340px; top: -100px; right: -80px;  border-color: rgba(149,196,191,0.15); }
  .ring-3 { width: 180px; height: 180px; top: -20px;  right: 0px;    border-color: rgba(149,196,191,0.2); }
  .ring-4 { width: 320px; height: 320px; bottom: -100px; left: -100px; }
  .ring-5 { width: 180px; height: 180px; bottom: -50px;  left: -50px;  border-color: rgba(149,196,191,0.15); }

  /* ── Brand bar ── */
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 52px 56px 0;
    position: relative;
    z-index: 2;
  }

  .brand-icon { width: 28px; height: 28px; }

  .brand-name {
    font-weight: 300;
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--sage-teal);
  }

  /* ── Main content ── */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 56px;
    position: relative;
    z-index: 2;
    text-align: center;
  }

  .check-wrap {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: rgba(149,196,191,0.15);
    border: 1.5px solid rgba(149,196,191,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 36px;
    animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  @keyframes popIn {
    from { transform: scale(0.5); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  .eyebrow {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--sage-teal);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: fadeUp 0.5s 0.15s both;
  }

  .eyebrow::before, .eyebrow::after {
    content: '';
    display: block;
    width: 24px;
    height: 1px;
    background: var(--sage-teal);
    opacity: 0.5;
  }

  .headline {
    font-family: 'DM Serif Display', serif;
    font-size: 62px;
    line-height: 1.04;
    color: var(--white);
    margin-bottom: 20px;
    letter-spacing: -0.5px;
    animation: fadeUp 0.5s 0.2s both;
  }

  .headline em {
    font-style: normal;
    color: var(--sage-teal);
  }

  .subline {
    font-size: 16px;
    font-weight: 300;
    color: rgba(255,255,255,0.5);
    line-height: 1.7;
    max-width: 380px;
    margin-bottom: 0;
    animation: fadeUp 0.5s 0.25s both;
  }

  .subline strong {
    color: var(--sage-teal);
    font-weight: 500;
  }

  /* ── Pulsing glow over the KioskBuddy "Tap to Pay" button ──
     Anchored to the bottom edge of the page, directly above the
     button in the KioskBuddy bar below. Only the top half of the
     glow and ripple rings is visible, so the light appears to rise
     from the button itself. ── */
  .tap-anchor {
    position: absolute;
    bottom: var(--tap-y);
    left: var(--tap-x);
    width: 0;
    height: 0;
    z-index: 1;
    pointer-events: none;
  }

  .tap-glow {
    position: absolute;
    width: 460px;
    height: 460px;
    left: -230px;
    top: -230px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(217,233,225,0.45) 0%,
      rgba(149,196,191,0.30) 32%,
      rgba(149,196,191,0.12) 52%,
      rgba(149,196,191,0)    70%);
    animation: glowPulse 2.4s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { opacity: 0.55; transform: scale(0.92); }
    50%      { opacity: 1;    transform: scale(1.08); }
  }

  .tap-ring {
    position: absolute;
    width: 120px;
    height: 120px;
    left: -60px;
    top: -60px;
    border-radius: 50%;
    border: 2px solid rgba(149,196,191,0.85);
    opacity: 0;
    animation: ringExpand 2.4s ease-out infinite;
  }

  /* children of .tap-anchor: 1 = glow, 2/3/4 = rings */
  .tap-ring:nth-child(3) { animation-delay: 0.8s; }
  .tap-ring:nth-child(4) { animation-delay: 1.6s; }

  @keyframes ringExpand {
    0%   { transform: scale(0.35); opacity: 0.9; }
    70%  { opacity: 0.25; }
    100% { transform: scale(2.6);  opacity: 0; }
  }

  /* ── Footer note ── */
  .footer-note {
    position: absolute;
    bottom: 44px;
    left: 56px;
    text-align: left;
    font-size: 12px;
    font-weight: 300;
    color: rgba(255,255,255,0.25);
    letter-spacing: 0.04em;
    z-index: 2;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="page">
  <div class="ring ring-1"></div>
  <div class="ring ring-2"></div>
  <div class="ring ring-3"></div>
  <div class="ring ring-4"></div>
  <div class="ring ring-5"></div>

  <div class="content">
    <div class="check-wrap">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#95C4BF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <div class="eyebrow" id="eyebrow">You're all set</div>

    <h1 class="headline" id="headline">Enjoy your<br><em>session.</em></h1>

    <p class="subline">
      To finalise your check-in, tap the<br>
      <strong>Tap to Pay</strong> button in the bottom right.
    </p>
  </div>

  <div class="tap-anchor">
    <div class="tap-glow"></div>
    <div class="tap-ring"></div>
    <div class="tap-ring"></div>
    <div class="tap-ring"></div>
  </div>

  <p class="footer-note">128A George Street, East Fremantle</p>
</div>

<script>
  // ─── CONFIG ──────────────────────────────────────────────────────────────────
  const SUPABASE_URL      = 'https://hurctwfeueytlkpdrrpm.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1cmN0d2ZldWV5dGxrcGRycnBtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1MjkzMjksImV4cCI6MjA5MzEwNTMyOX0.3sEwa9oeB-k1OQtrEu-_MMpUxvd5sCvmFOzBP_Xp52E';
  // ─────────────────────────────────────────────────────────────────────────────

  (async function() {
    let firstName = '';

    // Step 1: try to read from localStorage (set by sauna-ice.html on returning check-ins)
    try {
      const storedName = localStorage.getItem('tribe_checkin_name');
      const storedAt   = parseInt(localStorage.getItem('tribe_checkin_at') || '0', 10);
      // Only trust the stored name if it was set in the last 60 seconds
      if (storedName && (Date.now() - storedAt) < 60000) {
        firstName = storedName;
      }
    } catch (e) { /* localStorage unavailable, fall through */ }

    // Step 2: fallback — look up the most recent visit in Supabase (for post-Tally arrivals)
    if (!firstName) {
      try {
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/kiosk_visits?select=first_name&order=check_in_at.desc&limit=1`,
          { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
        );
        if (res.ok) {
          const visits = await res.json();
          if (visits.length > 0 && visits[0].first_name) {
            firstName = visits[0].first_name;
          }
        }
      } catch (e) { /* network error, just show generic message */ }
    }

    // Step 3: personalise the page if we have a name
    if (firstName) {
      const cleanName = firstName.charAt(0).toUpperCase() + firstName.slice(1).toLowerCase();
      document.getElementById('eyebrow').textContent = `Thanks, ${cleanName}`;
      document.getElementById('headline').innerHTML = `Enjoy your<br><em>session.</em>`;
    }

    // Clear localStorage so the next person doesn't see this name
    try {
      localStorage.removeItem('tribe_checkin_name');
      localStorage.removeItem('tribe_checkin_at');
    } catch (e) { /* ignore */ }
  })();
</script>

</body>
</html>
